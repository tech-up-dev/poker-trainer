<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Poker Trainer</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #10b981;
        color: #0f172a;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #34d399;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Poker Trainer needs a connection to load fresh lessons. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
